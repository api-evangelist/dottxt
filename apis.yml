name: dottxt
description: >-
  dottxt (styled .txt) is the company behind Outlines, the open-source
  structured-generation library for LLMs with 65M+ downloads. Its hosted
  platform API (api.dottxt.ai) is an OpenAI-compatible Chat Completions endpoint
  that guarantees 100% schema-compliant model output by construction using
  constrained decoding: pass a JSON Schema via `response_format` and the model
  produces exactly that shape — no retries, no validation loops, no defensive
  parsing. Output can be streamed as token deltas (SSE) or field-by-field as RFC
  6902 JSON Patch events. dottxt also ships self-hosted, drop-in replacements for
  vLLM, SGLang and TensorRT-LLM inference servers, and composable libraries
  (dotjson for JSON Schema, dotgrammar for context-free grammars, dotlambda for
  function calling). Backed by EQT Ventures and Seedcamp.
